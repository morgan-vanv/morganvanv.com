<nav>
  <ul>
    @for (link of navLinks; track link.route; let i = $index) {
      <li>
        <a [routerLink]="link.route"
           routerLinkActive="active-link"
           #rla="routerLinkActive"
           [routerLinkActiveOptions]="{ exact: !!link.exact }"
           [attr.aria-label]="link.ariaLabel ?? null">
          @if (rla.isActive && i > 1) {
            <app-icon name="chevron-left" class="nav-arrow nav-arrow-left" />
          }
          @if (link.icon) {
            <app-icon [name]="link.icon" class="nav-icon" />
          } @else {
            <span>{{ link.label }}</span>
          }
          @if (rla.isActive && i < navLinks.length - 1) {
            <app-icon name="chevron-right" class="nav-arrow nav-arrow-right" />
          }
        </a>
      </li>
    }
  </ul>
</nav>
