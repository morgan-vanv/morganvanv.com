@if (sky.lookingUp()) {
  <button type="button" class="back look-up-surface" [class.beside-panel]="sky.naming()" (click)="backToPage()">
    <app-icon name="chevron-left" />
    <span>back to the page</span>
  </button>
}
<!-- Loaded the first time someone names a star, so it isn't in every page's first download. -->
@defer (when sky.naming()) {
  @if (sky.naming()) {
    <app-star-naming (closed)="closePanel()" (back)="backToPage()" />
  }
}
