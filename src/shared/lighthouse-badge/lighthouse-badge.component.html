@if (report()) {
  <a class="badge" [href]="psiUrl" target="_blank" rel="noopener noreferrer" [attr.aria-label]="label()">
    <span class="glyph" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <polygon points="14,6 23,3 23,10" class="beam" />
        <polygon points="10,6 1,3 1,10" class="beam" />
        <path d="M9 22 L10.4 9.5 H13.6 L15 22 Z" class="tower" />
        <path d="M10 14.5 H14 M9.6 18 H14.4" class="stripe" />
        <rect x="10" y="5" width="4" height="4.5" class="lamp" />
        <path d="M9.3 5 L12 2.4 L14.7 5 Z" class="roof" />
      </svg>
    </span>
    <span class="text" aria-hidden="true">
      <span class="name">Lighthouse</span>
      <span class="scores">
        @for (row of rows(); track row.key) {
          <span>{{ row.value }}</span>
        }
      </span>
    </span>
  </a>

  <!-- Shown on hover/focus; the link's aria-label already says all of it. -->
  <span class="popover" aria-hidden="true">
    <span class="popover-label">Homepage, on a phone</span>
    @for (row of rows(); track row.key) {
      <span class="popover-row"><span>{{ row.label }}</span><b>{{ row.value }}</b></span>
    }
    <span class="popover-when">measured at deploy · {{ measured() }}</span>
    <span class="popover-cta">check my homework ↗</span>
  </span>
}
