@if (moon(); as moon) {
  <app-badge name="Moon" [value]="moon.value" [label]="moon.label" [popover]="moon.popover" (pressed)="sky.openMenu()">
    <svg glyph width="22" height="22" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" class="g-gold" opacity="0.16" />
      <circle cx="12" cy="12" r="8" class="g-deep g-stroke" stroke-opacity="0.35" />
      @if (moon.path) {
        <path [attr.d]="moon.path" class="g-white" opacity="0.92" />
      }
    </svg>
  </app-badge>
}
