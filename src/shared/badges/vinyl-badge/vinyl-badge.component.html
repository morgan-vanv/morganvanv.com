@if (vinyl(); as vinyl) {
  <app-badge name="Vinyl Collection" [value]="vinyl.value" [href]="href" [label]="vinyl.label" [popover]="vinyl.popover">
    <svg glyph width="22" height="22" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" class="g-deep g-stroke" stroke-opacity="0.55" />
      <circle cx="12" cy="12" r="6.5" class="g-line" stroke-opacity="0.22" />
      <circle cx="12" cy="12" r="3" class="g-gold" />
      <circle cx="12" cy="12" r="0.8" class="g-deep" />
    </svg>
  </app-badge>
}
