@if (count) {
  <app-badge name="Photo Wall" [value]="value" route="/social" [label]="label" [popover]="popover">
    <svg glyph width="22" height="22" viewBox="0 0 24 24">
      <g transform="rotate(-7 12 12)">
        <rect x="5.5" y="3" width="13" height="17" rx="1" class="g-white" opacity="0.9" />
        <rect x="7.2" y="4.8" width="9.6" height="9.6" class="g-gold" opacity="0.75" />
      </g>
    </svg>
  </app-badge>
}
