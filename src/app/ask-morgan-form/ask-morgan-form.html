<div class="ask-morgan-container">
  <h3>Ask Morgan</h3>
  
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="submitForm()" #askForm="ngForm">
    <!-- Honeypot field -->
    <div class="honey-pot">
      <label for="username_honey">Leave this field blank if you are human:</label>
      <input type="text" id="username_honey" name="username_honey" [(ngModel)]="username_honey" tabindex="-1" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="question">Your Question (anonymous)</label>
      <textarea 
        id="question" 
        name="question" 
        [(ngModel)]="question" 
        maxlength="500" 
        rows="4" 
        placeholder="What's on your mind?"
        required
        [disabled]="isSubmitting"
      ></textarea>
      <div class="char-counter">
        {{ question.length }} / 500
      </div>
    </div>

    <button type="submit" [disabled]="isSubmitting || !question.trim()">
      {{ isSubmitting ? 'Sending...' : 'Submit' }}
    </button>
  </form>
</div>
