<div class="character-panel">
  <h3>{{ username }}</h3>
  <div class="character-img-wrapper">
    <model-viewer
      src="tipodissdong.glb"
      poster="osrs-character.webp"
      [attr.alt]="username"
      [attr.auto-rotate]="autoRotate() ? '' : null"
      camera-controls
      disable-zoom
      shadow-intensity="1"
      class="character-model">
    </model-viewer>
    <div class="character-badges">
      @for (badge of badges; track badge.label) {
        <a [href]="badge.href" target="_blank" rel="noopener noreferrer" class="character-badge">
          <img [src]="badge.iconUrl" [alt]="badge.alt" class="badge-icon" />
          <span>{{ badge.label }}</span>
        </a>
      }
    </div>
  </div>
</div>
