<div class="panel">
  <h3>Boss Kills @if (rows().length) {<span class="range-label">{{ rows().length }} bosses · {{ totalKills() }} kills</span>}</h3>
  <ol class="boss-grid">
    @for (boss of rows(); track boss.metric; let i = $index) {
      <li class="boss-item" [class.top]="i < 3" [title]="boss.name + ': ' + boss.kills">
        <img [src]="'osrs/bosses/' + boss.metric + '.webp'" class="boss-icon" alt="" width="20" height="20" loading="lazy" />
        <span class="boss-name">{{ boss.name }}</span>
        <span class="boss-kc">{{ boss.kills }}</span>
      </li>
    } @empty {
      <li class="loading-text">No boss kills yet.</li>
    }
  </ol>
</div>
