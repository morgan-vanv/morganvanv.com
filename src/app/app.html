<!--This is the "canvas" for the website, the background upon which the action happens.
    The painted background shows first; the live sky fades in over it once it's ready.-->
<div class="canvas" [class.looking-up]="sky.lookingUp()">
  <app-sky />
</div>

<!-- Looking up (from the ☾ menu) fades the page away and makes it inert, so the whole window is sky. -->
<main [class.looking-up]="sky.lookingUp()" [attr.inert]="sky.lookingUp() ? '' : null">
  <router-outlet />
</main>

<app-sky-look-up />
<app-sky-menu />
