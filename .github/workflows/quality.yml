name: Quality

# Lighthouse (performance, best practices, SEO, and axe-core accessibility) against the prerendered
# build: every page in the sitemap, three runs each, once as desktop and once as a phone. What fails
# and what only warns is in lighthouserc.cjs; the scores land on this check's Summary page.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration=production
      # Both form factors run even if the first fails, and each writes its scores to the job summary.
      - name: Lighthouse (desktop)
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.cjs
      - name: Summary (desktop)
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs Desktop
      - name: Lighthouse (mobile)
        if: ${{ !cancelled() }}
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.cjs
        env:
          LH_FORM_FACTOR: mobile
      - name: Summary (mobile)
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs Mobile
