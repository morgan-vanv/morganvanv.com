name: CI

# Every PR into master. Lint and Test run beside one production build; Lighthouse and the layout check
# then run against that same build. The job names are the required checks (Lint, Test, Build, Lighthouse,
# Layout), so rename one only together with the ruleset.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration=production
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/browser
          retention-days: 1

  # Performance, best practices, SEO and axe-core accessibility: every page in the sitemap, three runs each,
  # as desktop and as a phone. What fails and what only warns is in lighthouserc.cjs; the scores land on
  # this job's Summary page and as annotations.
  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/browser
      # Both form factors run even if the first fails, and each writes its scores to the job summary.
      - name: Lighthouse (desktop)
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.cjs
      - name: Summary (desktop)
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs Desktop
      - name: Lighthouse (mobile)
        if: ${{ !cancelled() }}
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.cjs
        env:
          LH_FORM_FACTOR: mobile
      - name: Summary (mobile)
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs Mobile

  # Every page at 360×740 → 2560×1080 in the runner's Chrome: no sideways scroll, one h1, 44px tap
  # targets, the ☾ clear of the pager (scripts/check-layout.mjs).
  layout:
    name: Layout
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/browser
      - run: npm run layout
