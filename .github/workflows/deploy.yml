name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, for the Build badge: the merged PR's checks and the deploy history.
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Full history, so the Build badge can number this commit (git rev-list --count).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/

      # Unknown URLs get the client-side shell (not a prerendered page), so the
      # router can redirect to the greeting without a hydration mismatch.
      - name: Copy the CSR shell to 404.html for SPA routing
        run: cp dist/browser/index.csr.html dist/browser/404.html

      # The Lighthouse and Page weight badges on /now: three runs of the homepage as a phone, median
      # scores and weights written to dist/browser/lighthouse.json. Never blocks a deploy: if this fails,
      # the badges just hide.
      - name: Measure the homepage for the Lighthouse badge
        continue-on-error: true
        timeout-minutes: 10
        env:
          LH_FORM_FACTOR: mobile
          LH_PAGES: /
        run: |
          npx --yes @lhci/cli@0.15.x collect --config=./lighthouserc.cjs
          node scripts/write-lighthouse-badge.mjs

      # The Build badge on /now: this commit's number, the merged PR's checks, a test run with coverage
      # and the deploy history, written to dist/browser/site-status.json. Never blocks a deploy either.
      # The tests run without the token; only the small script that reads the GitHub API gets it.
      - name: Run the tests for the Build badge
        continue-on-error: true
        timeout-minutes: 10
        run: npx ng test --watch=false --coverage --coverage-reporters=json-summary --reporters=default --reporters=json --output-file=test-results.json

      - name: Record what built this for the Build badge
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/write-site-status.mjs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
