name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/

      # Unknown URLs get the client-side shell (not a prerendered page), so the
      # router can redirect to the greeting without a hydration mismatch.
      - name: Copy the CSR shell to 404.html for SPA routing
        run: cp dist/browser/index.csr.html dist/browser/404.html

      # The Lighthouse badge on /now: three runs of the homepage as a phone, median scores written to
      # dist/browser/lighthouse.json. Never blocks a deploy: if this fails, the badge just hides.
      - name: Measure the homepage for the Lighthouse badge
        continue-on-error: true
        env:
          LH_FORM_FACTOR: mobile
          LH_PAGES: /
        run: |
          npx --yes @lhci/cli@0.15.x collect --config=./lighthouserc.cjs
          node scripts/write-lighthouse-badge.mjs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
