name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master
  # Daily, so the Letterboxd diary stays about a day fresh (the badges re-measure as a side effect).
  # 10:17 UTC is early morning in Cincinnati, off the hour when GitHub's schedules bunch up.
  # GitHub turns schedules off after 60 days without repo activity (it emails first); the diary then just
  # goes stale until the workflow is enabled again in the Actions tab.
  schedule:
    - cron: '17 10 * * *'
  # "Run workflow" in the Actions tab: redeploy master now, e.g. right after logging a film.
  workflow_dispatch:

permissions:
  contents: read

# Per branch, so a "Run workflow" on another branch (skipped below) can't cancel a master deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # "Run workflow" lets you pick a branch; only master deploys (a branch run would otherwise build
    # unreviewed code, and its failure would count as a failed deploy on the Build badge).
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, for the Build badge: the merged PR's checks and the deploy history.
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Full history, so the Build badge can number this commit (git rev-list --count).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/

      # Unknown URLs get the client-side shell (not a prerendered page), so the
      # router can redirect to the greeting without a hydration mismatch.
      - name: Copy the CSR shell to 404.html for SPA routing
        run: cp dist/browser/index.csr.html dist/browser/404.html

      # The Letterboxd diary (Favorite Media on /interests, Watched on /now): the public RSS feed, read
      # here because it's CORS-blocked in the browser, written to dist/browser/letterboxd.json. Falls back
      # to the live site's copy, then to the placeholder (and the diary hides). Never blocks a deploy.
      - name: Read the Letterboxd diary
        continue-on-error: true
        timeout-minutes: 2
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/write-letterboxd.mjs

      # The Lighthouse and Page weight badges on /now: three runs of the homepage as a phone, median
      # scores and weights written to dist/browser/lighthouse.json. Never blocks a deploy: if this fails,
      # the badges just hide.
      - name: Measure the homepage for the Lighthouse badge
        continue-on-error: true
        timeout-minutes: 10
        env:
          LH_FORM_FACTOR: mobile
          LH_PAGES: /
        run: |
          npx --yes @lhci/cli@0.15.x collect --config=./lighthouserc.cjs
          node scripts/write-lighthouse-badge.mjs

      # The Build badge on /now: this commit's number, the merged PR's checks, a test run with coverage
      # and the deploy history, written to dist/browser/site-status.json. Never blocks a deploy either.
      # The tests run without the token; only the small script that reads the GitHub API gets it.
      - name: Run the tests for the Build badge
        continue-on-error: true
        timeout-minutes: 10
        run: npx ng test --watch=false --coverage --coverage-reporters=json-summary --reporters=default --reporters=json --output-file=test-results.json

      - name: Record what built this for the Build badge
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/write-site-status.mjs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
